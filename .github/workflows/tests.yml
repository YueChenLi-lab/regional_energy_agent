name: v0.4.0 offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      LLM_API_KEY: ''
      LLM_BASE_URL: ''
      LLM_MODEL: ''
      LLM_PROVIDER: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=outputs/ci_tests.xml
      - run: python -m energy_agent.cli demo --output "outputs/CI 中文 路径"
      - run: python -m energy_agent.cli data-replay --output "outputs/CI 离线 重放"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-tests-${{ matrix.os }}
          path: outputs/ci_tests.xml
